<p>点击下面按钮，直接在 GitHub 网页端新建一篇文章（自动放到 <code>_posts</code>）。</p>
<button id="newPostBtn">新建文章</button>

<script>
  (function () {
    const user = "RayZYunYan";
    const repo = "Blog_RayZ.github.io"; // ← 确保与仓库同名
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    const date = `${yyyy}-${mm}-${dd}`;

    const md = `---
layout: post
title: "在这里写标题"
date: ${date}
---

这里写正文。支持 **Markdown**、图片、代码块等。
`;

    const base = `https://github.com/${user}/${repo}/new/main/_posts`;
    const params = new URLSearchParams({ filename: `${date}-new-post.md`, value: md });
    const url = `${base}?${params.toString()}`;
    document.getElementById("newPostBtn").onclick = () => { window.location.href = url; };
  })();
</script>
